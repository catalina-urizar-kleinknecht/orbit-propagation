name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        id: sync
        run: uv sync --locked

      # each suite runs even if an earlier one failed, so one run reports all three
      - name: Unit tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/unit -v

      - name: Integration tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/integration -v

      - name: Regression tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/regression -v
